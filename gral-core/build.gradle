description = 'GRAL core'

dependencies {
	testImplementation 'junit:junit:4.13.2'
}

jar {
	manifest {
		attributes(
			'Automatic-Module-Name': 'de.erichseifert.gral',
			'Implementation-Title': rootProject.name,
			'Implementation-Version': project.version,
			'Implementation-Vendor': owner1_name,
		)
	}
}

/*
 * JMH benchmarks. Previously handled by the jmh-gradle-plugin, which is not
 * needed for the single benchmark in this project.
 */
sourceSets {
	jmh {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

dependencies {
	jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
	jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register('jmh', JavaExec) {
	description = 'Runs the JMH benchmarks.'
	group = 'Verification'
	classpath = sourceSets.jmh.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
}

apply plugin: 'jacoco'

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('report') {
	description = 'Generates reports.'
	group = 'Report'
	dependsOn(tasks.named('jacocoTestReport'), tasks.named('check'))
}

apply plugin: 'maven-publish'
apply plugin: 'signing'

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			pom {
				name = rootProject.name
				description = rootProject.description
				url = website
				inceptionYear = project.inceptionYear.toString()
				licenses {
					license {
						name = 'GNU Library or Lesser General Public License (LGPL)'
						url = 'http://www.gnu.org/licenses/lgpl.txt'
					}
				}
				developers {
					developer {
						id = owner1_id
						name = owner1_name
						email = owner1_email
					}
					developer {
						id = owner2_id
						name = owner2_name
						email = owner2_email
					}
				}
				scm {
					connection = 'scm:git:git://github.com/eseifert/gral.git'
					developerConnection = 'scm:git:git@github.com:eseifert/gral.git'
					url = website
				}
				issueManagement {
					system = 'GitHub Issues'
					url = website
				}
			}
		}
	}

	/*
	 * No remote repository is declared here on purpose. Releases leave the
	 * build through the Central Portal publisher API, which the NMCP plugin
	 * configured in settings.gradle drives; see the 'publish' task below.
	 */
}

signing {
	/*
	 * Signing is required as soon as a key is configured. The condition used to
	 * inspect the task graph for a PublishToMavenRepository as well, which
	 * still holds with NMCP, but it ties the correctness of the signatures to
	 * the shape of the graph and it reads the graph at execution time, which
	 * the configuration cache does not allow. Ordinary builds are unaffected,
	 * because 'build' does not depend on the signing tasks.
	 */
	required = { project.hasProperty('signing.keyId') }
	sign publishing.publications.mavenJava
}

/*
 * Credentials and publishing mode for the Central Portal. The aggregation task
 * in the root project reads these from settings.gradle, but the per-project
 * task used below needs its own configuration.
 */
nmcp {
	publishAllPublicationsToCentralPortal {
		username = providers.gradleProperty('ossrhUsername')
		password = providers.gradleProperty('ossrhPassword')
		publishingType = providers.gradleProperty('centralPublishingType')
				.getOrElse('AUTOMATIC')
	}
}

/*
 * The version comes from 'git describe', which yields something like
 * 0.12-7-gdeadbee on a commit that isn't tagged. Such a version is not a
 * snapshot, so nothing else would stop it from being released to Maven Central
 * under a coordinate that can never be replaced afterwards.
 */
def checkReleaseVersion = tasks.register('checkReleaseVersion') {
	description = 'Checks that the version was derived from a release tag.'
	group = 'verification'

	def candidate = project.version.toString()
	doLast {
		if (!(candidate ==~ ~/^\d+\.\d+(\.\d+)?$/)) {
			throw new GradleException(
				"Refusing to publish version '${candidate}'. Releases have to " +
				'be built from a release tag, for example 0.13.')
		}
	}
}

def publishToCentralPortal = tasks.named('nmcpPublishAllPublicationsToCentralPortal') {
	dependsOn(checkReleaseVersion)
}

/*
 * Makes the publisher API the default route out of the build, so that a release
 * is a single 'gradlew :gral-core:publish' and needs no further step in the
 * Central Portal.
 */
tasks.named('publish') {
	dependsOn(publishToCentralPortal)
}
