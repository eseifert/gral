description = 'GRAL core'

dependencies {
	testImplementation 'junit:junit:4.13.2'
}

jar {
	manifest {
		attributes(
			'Automatic-Module-Name': 'de.erichseifert.gral',
			'Implementation-Title': rootProject.name,
			'Implementation-Version': project.version,
			'Implementation-Vendor': owner1_name,
		)
	}
}

/*
 * JMH benchmarks. Previously handled by the jmh-gradle-plugin, which is not
 * needed for the single benchmark in this project.
 */
sourceSets {
	jmh {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

dependencies {
	jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
	jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register('jmh', JavaExec) {
	description = 'Runs the JMH benchmarks.'
	group = 'Verification'
	classpath = sourceSets.jmh.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
}

apply plugin: 'jacoco'

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('report') {
	description = 'Generates reports.'
	group = 'Report'
	dependsOn(tasks.named('jacocoTestReport'), tasks.named('check'))
}

apply plugin: 'maven-publish'
apply plugin: 'signing'

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			pom {
				name = rootProject.name
				description = rootProject.description
				url = website
				inceptionYear = project.inceptionYear.toString()
				licenses {
					license {
						name = 'GNU Library or Lesser General Public License (LGPL)'
						url = 'http://www.gnu.org/licenses/lgpl.txt'
					}
				}
				developers {
					developer {
						id = owner1_id
						name = owner1_name
						email = owner1_email
					}
					developer {
						id = owner2_id
						name = owner2_name
						email = owner2_email
					}
				}
				scm {
					connection = 'scm:git:git://github.com/eseifert/gral.git'
					developerConnection = 'scm:git:git@github.com:eseifert/gral.git'
					url = website
				}
				issueManagement {
					system = 'GitHub Issues'
					url = website
				}
			}
		}
	}

	repositories {
		/*
		 * oss.sonatype.org was shut down in 2025. This is the OSSRH-compatible
		 * endpoint of its successor, the Central Portal.
		 */
		maven {
			name = 'sonatype'
			url = version.toString().endsWith('SNAPSHOT')
				? 'https://central.sonatype.com/repository/maven-snapshots/'
				: 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
			credentials {
				username = project.findProperty('ossrhUsername') ?: ''
				password = project.findProperty('ossrhPassword') ?: ''
			}
		}
	}
}

signing {
	required = {
		project.hasProperty('signing.keyId') &&
			gradle.taskGraph.allTasks.any { it instanceof PublishToMavenRepository }
	}
	sign publishing.publications.mavenJava
}
