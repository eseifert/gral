description = 'GRAL core'

ext.pomName = rootProject.name
ext.pomDescription = rootProject.description

/*
 * de.erichseifert.gral.TestUtils defines the conventions of the test suite and
 * is needed by the tests of the other modules as well, so it lives in a test
 * fixture instead of in src/test. The test source set depends on the fixtures
 * automatically, which is why the test libraries are declared here only.
 */
apply plugin: 'java-test-fixtures'

dependencies {
	// JUnit pulls in Hamcrest 1.3, which lacks the order-sensitive collection
	// matchers (contains, containsInAnyOrder). Exclude it in favour of the
	// standalone Hamcrest artifact, which supersedes hamcrest-core.
	testFixturesApi('junit:junit:4.13.2') {
		exclude group: 'org.hamcrest'
	}
	testFixturesApi 'org.hamcrest:hamcrest:2.2'
}

/*
 * The fixtures are an internal build artifact: they are consumed by the other
 * modules of this build, but they are not part of the release.
 */
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) {
	skip()
}
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) {
	skip()
}

jar {
	manifest {
		attributes(
			'Automatic-Module-Name': 'de.erichseifert.gral',
			'Implementation-Title': rootProject.name,
			'Implementation-Version': project.version,
			'Implementation-Vendor': owner1_name,
		)
	}
}

/*
 * JMH benchmarks. Previously handled by the jmh-gradle-plugin, which is not
 * needed for the single benchmark in this project.
 */
sourceSets {
	jmh {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

dependencies {
	jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
	jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register('jmh', JavaExec) {
	description = 'Runs the JMH benchmarks.'
	group = 'Verification'
	classpath = sourceSets.jmh.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
}

apply plugin: 'jacoco'

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('report') {
	description = 'Generates reports.'
	group = 'Report'
	dependsOn(tasks.named('jacocoTestReport'), tasks.named('check'))
}
