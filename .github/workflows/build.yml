name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Gradle itself needs Java 17 or later. The library is compiled for
        # Java 11 regardless of the JDK used here.
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v4
        with:
          # The project version is derived from git describe --tags.
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A few tests in gral-swing and gral-javafx need a real display. They
      # skip themselves when none is available, so run them under Xvfb to keep
      # them covered. JavaFX additionally loads GTK 3 at run time; the package
      # was renamed in Ubuntu 24.04, so both names are tried.
      - name: Install Xvfb and GTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 \
            || sudo apt-get install -y --no-install-recommends libgtk-3-0

      - name: Build
        run: xvfb-run --auto-servernum ./gradlew build --stacktrace

      - name: Coverage report
        if: matrix.java == '21'
        run: xvfb-run --auto-servernum ./gradlew :gral-core:jacocoTestReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  # The build above runs everything under Xvfb, which is exactly why issue #181
  # — headless SVG export — could sit unnoticed. This leg installs no Xvfb and
  # has no DISPLAY, so a render path that reaches for a screen fails here. It
  # runs the two modules that must not need one: the core, and the examples,
  # whose tests render every entry of Examples.createAll() to PNG, SVG, PDF and
  # EPS and compare it with the golden images checked in beside them.
  headless:
    name: Headless rendering and export
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The project version is derived from git describe --tags.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Render and export without a display
        run: ./gradlew :gral-core:test :gral-examples:test --stacktrace

      - name: Upload rendering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-reports
          path: |
            gral-examples/build/reports/golden/
            gral-examples/build/reports/fonts/
            gral-examples/build/reports/tests/
            gral-examples/build/test-results/
          retention-days: 14

  # Characterizes the one thing the core needs from its machine: a font. Every
  # label goes through GraphicsUtils.getOutline, and the seven Font.decode(null)
  # defaults resolve through the platform's font configuration. The Temurin
  # images ship no fontconfig and no font, which is the runtime a lot of users
  # deploy into, so this leg records what GRAL does there instead of leaving it
  # to be discovered. It is allowed to fail: it documents a limitation rather
  # than guarding one, and README.rst carries the conclusion.
  fonts:
    name: Headless without fonts
    runs-on: ubuntu-latest
    continue-on-error: true

    container:
      image: eclipse-temurin:21-jdk

    steps:
      # The image has no git, which both the checkout action and the version
      # derived from 'git describe' need.
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Characterize the font environment
        run: ./gradlew :gral-examples:test --tests '*FontEnvironmentTest' --stacktrace

      - name: Show what was found
        if: always()
        run: cat gral-examples/build/reports/fonts/font-environment.txt || true

      - name: Upload the font report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-environment
          path: |
            gral-examples/build/reports/fonts/
            gral-examples/build/reports/tests/
          retention-days: 14
